<!doctype html>
<html lang="{{ locale }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}道の縁{% endblock %}</title>
    <style>
      body { max-width: 640px; margin: 40px auto; padding: 0 16px; font-family: sans-serif; line-height: 1.6; }
      label, input, select, button { display: block; width: 100%; box-sizing: border-box; }
      label { margin-top: 16px; font-weight: bold; }
      input, button { padding: 10px; font-size: 16px; }
      button { margin-top: 24px; cursor: pointer; }
      .error { color: #b00020; }
      li { margin: 8px 0; }
      fieldset { margin-top: 16px; }
      fieldset label { font-weight: normal; }
      fieldset input { display: inline; width: auto; }
      .badge { display: inline-block; min-width: 1.3em; padding: 0 0.25em; border-radius: 1em; background: #c62828; color: white; font-size: 0.85em; text-align: center; }
      .notice { padding: 12px; border: 2px solid #c62828; background: #fff3f3; font-weight: bold; }
      .home { margin-top: 48px; }
      .tagline { font-size: 1.3rem; font-weight: bold; }
      .actions { display: grid; gap: 12px; margin: 28px 0; }
      .button-link { display: block; padding: 14px; border-radius: 8px; background: #176b4d; color: white; font-size: 1.1rem; font-weight: bold; text-align: center; text-decoration: none; }
      .button-link.secondary { background: #245a9c; }
      .notes { margin-top: 32px; padding: 16px; border-radius: 8px; background: #f4f4f4; }
    </style>
  </head>
  <body>
    <header>
      <a href="{{ url_for('index') }}">{{ t.app_name }}</a>
      <a href="{{ url_for('new_request') }}">{{ t.request_ride }}</a>
      <a href="{{ url_for('driver_requests') }}">
        {{ t.driver_requests }}
        {% if pending_request_count %}<span class="badge">{{ pending_request_count }}</span>{% endif %}
      </a>
      <nav aria-label="{{ t.language }}">
        <a href="{{ url_for('set_language', locale='ja') }}" {% if locale == 'ja' %}aria-current="page"{% endif %}>日本語</a>
        <a href="{{ url_for('set_language', locale='en') }}" {% if locale == 'en' %}aria-current="page"{% endif %}>English</a>
      </nav>
    </header>
    {% block content %}{% endblock %}
  </body>
</html>
