<!doctype html>
<html lang="{{ locale }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}道の縁{% endblock %}</title>
    <style>
      :root { --forest: #1f4d3a; --forest-dark: #123629; --moss: #75936b; --cream: #f8f4ea; --paper: #fffdf8; --ink: #1e2a24; --muted: #68736d; --line: #dce2d8; --clay: #b75539; --clay-dark: #963b25; --sky: #e8f1ec; --shadow: 0 12px 30px rgba(31, 77, 58, .10); }
      * { box-sizing: border-box; }
      body { margin: 0; background: linear-gradient(150deg, #eef3ea 0%, var(--cream) 45%, #f8f0e6 100%); color: var(--ink); font-family: "Noto Sans JP", "Hiragino Sans", system-ui, sans-serif; line-height: 1.7; }
      a { color: var(--forest); font-weight: 700; }
      .site-shell { width: min(100% - 32px, 860px); margin: 0 auto; }
      .site-header { display: flex; align-items: center; gap: 18px; min-height: 78px; border-bottom: 1px solid rgba(31, 77, 58, .15); }
      .brand { color: var(--forest-dark); font-size: 1.4rem; letter-spacing: .08em; text-decoration: none; white-space: nowrap; }
      .nav-links { display: flex; flex: 1; flex-wrap: wrap; gap: 8px 14px; }
      .nav-links a, .language-links a { font-size: .88rem; text-decoration: none; }
      .language-links { display: flex; gap: 8px; white-space: nowrap; }
      .language-links a { padding: 4px 8px; border-radius: 99px; color: var(--muted); }
      .language-links a[aria-current="page"] { background: var(--forest); color: white; }
      .page { padding: 42px 0 64px; }
      h1, h2, h3 { color: var(--forest-dark); line-height: 1.35; }
      h1 { margin: 0 0 8px; font-size: clamp(1.9rem, 6vw, 2.7rem); letter-spacing: .04em; }
      h2 { margin: 0 0 12px; font-size: 1.25rem; }
      p { margin: 0 0 16px; }
      .page-heading { margin-bottom: 24px; }
      .page-heading p { color: var(--muted); }
      .form-card, .content-card, .request-card, .notes, .result-card { padding: clamp(20px, 5vw, 32px); border: 1px solid rgba(31, 77, 58, .12); border-radius: 18px; background: rgba(255, 253, 248, .94); box-shadow: var(--shadow); }
      label, input, select, button { display: block; width: 100%; }
      label { margin-top: 20px; color: var(--forest-dark); font-size: .95rem; font-weight: 800; }
      input, select { min-height: 48px; margin-top: 6px; padding: 10px 12px; border: 1px solid #bdc9bd; border-radius: 10px; background: white; color: var(--ink); font: inherit; }
      input:focus, select:focus { outline: 3px solid rgba(117, 147, 107, .35); border-color: var(--moss); }
      button { min-height: 52px; margin-top: 26px; padding: 12px 18px; border: 0; border-radius: 10px; background: var(--forest); color: white; font: inherit; font-weight: 800; cursor: pointer; box-shadow: 0 7px 14px rgba(31, 77, 58, .2); transition: transform .15s, background .15s; }
      button:hover { background: var(--forest-dark); transform: translateY(-1px); }
      button[name="decision"][value="declined"] { margin-top: 10px; background: transparent; border: 1px solid #aeb9b0; box-shadow: none; color: var(--muted); }
      .error { margin: 0 0 18px; padding: 12px 14px; border-left: 4px solid var(--clay); border-radius: 8px; background: #fff1ed; color: #8c321d; font-weight: 700; }
      fieldset { margin: 24px 0 0; padding: 16px; border: 1px solid var(--line); border-radius: 12px; }
      legend { padding: 0 6px; color: var(--forest-dark); font-weight: 800; }
      fieldset label { display: inline-flex; width: auto; align-items: center; gap: 7px; margin: 7px 18px 7px 0; color: var(--ink); font-weight: 500; }
      fieldset input { width: auto; min-height: auto; margin: 0; accent-color: var(--forest); }
      .badge { display: inline-grid; min-width: 1.45em; padding: 0 .3em; border-radius: 99px; background: var(--clay); color: white; font-size: .78em; line-height: 1.65; place-items: center; }
      .notice { margin-bottom: 20px; border-color: #e3ba75; background: #fff9e9; color: #6e4c16; box-shadow: none; font-weight: 800; }
      .home { padding-top: 20px; }
      .hero { position: relative; overflow: hidden; padding: clamp(28px, 7vw, 56px); border-radius: 24px; background: radial-gradient(circle at top right, #bfd0aa, transparent 40%), linear-gradient(135deg, var(--forest-dark), var(--forest)); color: white; box-shadow: 0 18px 40px rgba(18, 54, 41, .24); text-align: center; }
      .hero::after { position: absolute; right: -18%; bottom: -38%; width: 75%; height: 74%; border: 26px solid rgba(248, 244, 234, .16); border-radius: 50% 50% 0 0; content: ""; transform: rotate(-18deg); }
      .hero > * { position: relative; z-index: 1; }
      .hero-mark { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 20px; color: #e7f0da; font-size: .78rem; font-weight: 800; letter-spacing: .14em; }
      .thumb-sign { display: grid; width: 48px; height: 48px; border: 2px solid rgba(255,255,255,.72); border-radius: 50%; background: rgba(255,255,255,.12); color: white; font-size: 1.9rem; line-height: 1; place-items: center; transform: rotate(-10deg); }
      .hero h1 { color: white; font-size: clamp(2.5rem, 10vw, 4rem); }
      .tagline { margin: 0 0 14px; color: #e8f1d9; font-size: clamp(1.05rem, 3vw, 1.35rem); font-weight: 800; }
      .hero-intro { max-width: 36rem; margin-right: auto; margin-left: auto; color: #f7f8ef; }
      .actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin: 24px 0 0; }
      .button-link { display: grid; min-height: 88px; padding: 16px; border-radius: 14px; background: #f5f1df; color: var(--forest-dark); font-size: 1.05rem; font-weight: 900; line-height: 1.4; place-items: center; text-align: center; text-decoration: none; transition: transform .15s, background .15s; }
      .button-link:hover { background: white; transform: translateY(-2px); }
      .button-link.secondary { background: #d7e5d1; }
      .button-icon { display: block; margin-bottom: 5px; font-size: 1.55rem; }
      .home-details { display: grid; grid-template-columns: 1fr 1.2fr; gap: 18px; margin-top: 22px; }
      .notes { margin: 0; background: rgba(255, 251, 242, .82); box-shadow: none; }
      .notes ul { margin: 0; padding-left: 1.25em; }
      .notes li { margin: 7px 0; }
      .result-url { overflow-wrap: anywhere; font-size: .9rem; }
      .result-card { margin-top: 20px; }
      .result-card.waiting { border-color: #d8c477; background: #fffbed; }
      .result-card.accepted { border-color: #9fc4a3; background: #f2faf0; }
      .result-card.declined { border-color: #e6b9ae; background: #fff4f0; }
      .meeting-code { display: inline-block; margin-top: 8px; padding: 8px 14px; border-radius: 8px; background: var(--forest-dark); color: white; font-size: 1.45rem; letter-spacing: .12em; }
      .refresh-link { display: inline-block; margin-top: 8px; padding: 10px 16px; border: 1px solid var(--forest); border-radius: 8px; text-decoration: none; }
      .request-list { display: grid; gap: 14px; margin: 0; padding: 0; list-style: none; }
      .request-card { display: grid; gap: 10px; padding: 20px; }
      .request-route { font-size: 1.1rem; font-weight: 800; }
      .request-meta, .map-links, .request-action { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
      .map-links a, .request-action a { padding: 5px 10px; border-radius: 7px; background: var(--sky); text-decoration: none; }
      .status { display: inline-block; padding: 4px 10px; border-radius: 99px; background: #eef1ed; color: var(--muted); font-size: .86rem; }
      .status.pending { background: #fff2c8; color: #775508; }
      .request-summary { margin: 0 0 20px; padding: 20px; border-radius: 14px; background: var(--sky); }
      .request-summary ul { margin: 0; padding-left: 1.2em; }
      .consent-card { max-width: 760px; margin: 0 auto; padding: clamp(26px, 6vw, 52px); border: 1px solid var(--line); border-radius: 24px; background: var(--paper); box-shadow: var(--shadow); }
      .consent-icon { display: grid; width: 52px; height: 52px; margin: 0 auto 10px; border-radius: 50%; background: var(--sky); font-size: 1.7rem; place-items: center; }
      .consent-card h1, .consent-card .consent-subtitle, .consent-brand { text-align: center; }
      .consent-brand { margin-bottom: 6px; color: var(--moss); font-size: .76rem; font-weight: 900; letter-spacing: .12em; }
      .consent-subtitle { color: var(--muted); }
      .terms { padding: 22px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
      .terms ol { margin: 0; padding-left: 1.4em; }
      .terms li { margin: 13px 0; padding-left: 4px; }
      .consent-closing { margin: 28px 0 8px; text-align: center; }
      .consent-closing h2 { font-size: 1.35rem; }
      .consent-button { background: #171717; }
      .consent-button:hover { background: #000; }
      .consent-note { margin: 16px 0 0; color: var(--muted); font-size: .88rem; text-align: center; }
      .consent-language { justify-content: center; margin-top: 14px; }
      @media (max-width: 650px) { .site-header { align-items: flex-start; flex-wrap: wrap; gap: 8px 14px; padding: 16px 0; } .nav-links { order: 3; flex-basis: 100%; } .page { padding-top: 28px; } .actions, .home-details { grid-template-columns: 1fr; } .hero { padding: 28px; } }
    </style>
  </head>
  <body>
    <div class="site-shell">
    {% if request.endpoint != 'consent' %}
    <header class="site-header">
      <a class="brand" href="{{ url_for('index') }}">{{ t.app_name }}</a>
      <nav class="nav-links" aria-label="Main navigation">
        <a href="{{ url_for('new_request') }}">{{ t.request_ride }}</a>
        <a href="{{ url_for('driver_requests') }}">
          {{ t.driver_requests }}
          {% if pending_request_count %}<span class="badge">{{ pending_request_count }}</span>{% endif %}
        </a>
      </nav>
      <nav class="language-links" aria-label="{{ t.language }}">
        <a href="{{ url_for('set_language', locale='ja') }}" {% if locale == 'ja' %}aria-current="page"{% endif %}>日本語</a>
        <a href="{{ url_for('set_language', locale='en') }}" {% if locale == 'en' %}aria-current="page"{% endif %}>English</a>
      </nav>
    </header>
    {% endif %}
    <main class="page">{% block content %}{% endblock %}</main>
    </div>
  </body>
</html>
