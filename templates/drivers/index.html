{% extends "base.html" %}

{% block title %}登録済みドライバー | 道の縁{% endblock %}

{% block content %}
  <h1>登録済みドライバー</h1>

  {% if drivers %}
    <ul>
      {% for driver in drivers %}
        <li>{{ driver.name }}：{{ driver.car_description }}</li>
      {% endfor %}
    </ul>
  {% else %}
    <p>まだドライバーは登録されていません。</p>
  {% endif %}

  <p><a href="{{ url_for('new_driver') }}">ドライバーを登録する</a></p>
{% endblock %}
