{% extends "base.html" %}

{% block title %}{{ t.driver_registration }} | {{ t.app_name }}{% endblock %}

{% block content %}
  <h1>{{ t.driver_registration }}</h1>
  <p>{{ t.driver_registration_intro }}</p>

  {% if error %}
    <p class="error">{{ error }}</p>
  {% endif %}

  <form method="post">
    <label for="name">{{ t.name }}</label>
    <input id="name" name="name" value="{{ request.form.get('name', '') }}" placeholder="{{ t.name_example }}" maxlength="50" required>

    <label for="car_description">{{ t.car_description }}</label>
    <input id="car_description" name="car_description" value="{{ request.form.get('car_description', '') }}" placeholder="{{ t.car_example }}" maxlength="100" required>

    <button type="submit">{{ t.register }}</button>
  </form>
{% endblock %}
