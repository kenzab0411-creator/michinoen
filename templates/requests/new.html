{% extends "base.html" %}

{% block title %}{{ t.request_ride }} | {{ t.app_name }}{% endblock %}

{% block content %}
  <div class="page-heading">
    <h1>{{ t.request_ride }}</h1>
    <p>{{ t.request_ride_intro }}</p>
  </div>

  {% if error %}
    <p class="error">{{ error }}</p>
  {% endif %}

  <form class="form-card" method="post">
    <label for="people_count">{{ t.people_count }}</label>
    <select id="people_count" name="people_count" required>
      <option value="">--</option>
      <option value="1" {% if request.form.get('people_count') == '1' %}selected{% endif %}>{{ t.one_person }}</option>
      <option value="2" {% if request.form.get('people_count') == '2' %}selected{% endif %}>{{ t.two_people }}</option>
      <option value="3+" {% if request.form.get('people_count') == '3+' %}selected{% endif %}>{{ t.three_or_more }}</option>
    </select>

    <fieldset>
      <legend>{{ t.gender }}</legend>
      <label><input type="radio" name="gender" value="male" required {% if request.form.get('gender') == 'male' %}checked{% endif %}> {{ t.male }}</label>
      <label><input type="radio" name="gender" value="female" {% if request.form.get('gender') == 'female' %}checked{% endif %}> {{ t.female }}</label>
      <label><input type="radio" name="gender" value="mixed" {% if request.form.get('gender') == 'mixed' %}checked{% endif %}> {{ t.mixed }}</label>
    </fieldset>

    <label for="age_group">{{ t.age_group }}</label>
    <select id="age_group" name="age_group" required>
      <option value="">--</option>
      <option value="teens" {% if request.form.get('age_group') == 'teens' %}selected{% endif %}>{{ t.teens }}</option>
      <option value="twenties" {% if request.form.get('age_group') == 'twenties' %}selected{% endif %}>{{ t.twenties }}</option>
      <option value="thirties_or_more" {% if request.form.get('age_group') == 'thirties_or_more' %}selected{% endif %}>{{ t.thirties_or_more }}</option>
    </select>

    <label for="pickup_location">{{ t.pickup_location }}</label>
    <input id="pickup_location" name="pickup_location" value="{{ request.form.get('pickup_location', '') }}" list="pickup-locations" placeholder="{{ t.pickup_location_example }}" maxlength="100" required>
    <datalist id="pickup-locations">
      <option value="平泉駅 / Hiraizumi Station">
      <option value="中尊寺 / Chuson-ji Temple">
      <option value="毛越寺 / Motsu-ji Temple">
    </datalist>
    <label for="pickup_map_url">{{ t.pickup_map_url }}</label>
    <input id="pickup_map_url" name="pickup_map_url" value="{{ request.form.get('pickup_map_url', '') }}" type="url" placeholder="https://maps.google.com/..." maxlength="500">

    <label for="destination">{{ t.destination }}</label>
    <input id="destination" name="destination" value="{{ request.form.get('destination', '') }}" list="destinations" placeholder="{{ t.destination_example }}" maxlength="100" required>
    <datalist id="destinations">
      <option value="中尊寺 / Chuson-ji Temple">
      <option value="毛越寺 / Motsu-ji Temple">
      <option value="平泉駅 / Hiraizumi Station">
    </datalist>
    <label for="destination_map_url">{{ t.destination_map_url }}</label>
    <input id="destination_map_url" name="destination_map_url" value="{{ request.form.get('destination_map_url', '') }}" type="url" placeholder="https://maps.google.com/..." maxlength="500">

    <button type="submit">{{ t.find_driver }}</button>
  </form>
{% endblock %}
